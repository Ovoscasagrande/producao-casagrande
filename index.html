<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel OVOS CASAGRANDE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#141414;--txt:#fff;--mut:#9a9a9a;--acc:#ffd400;--ok:#4ade80;--bad:#ff5c5c;--line:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px}

/* ===== sidebar ===== */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:64px;background:#000;border-right:1px solid var(--line);
 z-index:100;overflow:hidden;transition:width .25s ease;display:flex;flex-direction:column}
#sidebar:hover{width:220px}
#sidebar .logo-mini{height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);flex-shrink:0}
#sidebar .logo-mini img{height:44px;width:auto;transition:.25s}
#sidebar:hover .logo-mini img{height:40px}
#sidebar nav{padding:12px 0;flex:1}
#sidebar .item{display:flex;align-items:center;gap:14px;padding:14px 20px;color:var(--mut);cursor:pointer;white-space:nowrap;text-decoration:none}
#sidebar .item .ico{font-size:20px;width:24px;text-align:center;flex-shrink:0}
#sidebar .item .lbl{font-size:14px;opacity:0;transition:.2s}
#sidebar:hover .item .lbl{opacity:1}
#sidebar .item:hover{color:var(--txt);background:#141414}
#sidebar .item.on{color:var(--acc);border-left:3px solid var(--acc);padding-left:17px}
#sidebar .foot{padding:14px 20px;color:#555;font-size:11px;white-space:nowrap;opacity:0;transition:.2s}
#sidebar:hover .foot{opacity:1}
.main{margin-left:64px;transition:margin .25s ease}
#sidebar:hover ~ .main{margin-left:220px}

/* ===== home ===== */
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
#home img{height:300px;width:auto}
#home h1{font-size:34px;letter-spacing:.14em;font-weight:800}
#home .sub{color:var(--mut);font-size:13px;letter-spacing:.08em}
#home .btns{display:flex;gap:16px;margin-top:10px}
#home .btns button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;
 padding:16px 34px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
#home .btns button:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}
h1{font-size:19px;font-weight:700}
h2{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.head .sub{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs .dept{background:var(--acc);color:#000;border:none;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer}
.tabs .sub{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer}
.tabs .sub.on{background:#2a2a2a;color:var(--acc);border-color:var(--acc)}
.tabs .sub:hover{color:var(--txt)}
.dept-page{display:none}.dept-page.on{display:block}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px}
.kpi .d{font-size:11px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}.mut{color:var(--mut)}
.row2{grid-template-columns:2fr 1fr}.row3{grid-template-columns:1fr 1fr}
@media(max-width:900px){.row2,.row3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chartbox{position:relative;height:280px}.chartbox.tall{height:340px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid rgba(42,42,42,.6)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.bar{height:6px;border-radius:3px;background:var(--acc);min-width:2px}
.foot{color:var(--mut);font-size:11px;margin-top:14px;text-align:center}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.b{background:rgba(255,255,255,.12);color:#fff}.pill.v{background:rgba(255,212,0,.15);color:var(--acc)}
.note{color:var(--mut);font-size:12px;margin-top:10px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtros .fgroup{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
.filtros button{background:transparent;color:var(--mut);border:none;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer}
.filtros button:hover{color:var(--txt)}
.filtros button.on{background:var(--acc);color:#000;font-weight:700}
.filtros input[type=date]{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;color-scheme:dark}
.filtros select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;color-scheme:dark}
/* ===== modal de senha ===== */
#lockModal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:500}
#lockModal.on{display:flex}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(92vw,360px);text-align:center}
.lockbox .ico{font-size:40px}
.lockbox h3{margin:10px 0 4px;font-size:17px}
.lockbox .sub{color:var(--mut);font-size:12px;margin-bottom:16px}
.lockbox input{width:100%;background:#000;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:20px;text-align:center;letter-spacing:.35em;outline:none}
.lockbox input:focus{border-color:var(--acc)}
.lockbox .err{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}
.lockbox .btns{display:flex;gap:10px;margin-top:14px}
.lockbox .btns button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font-size:13px}
.lockbox .btns button.ok{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.lockbox .btns button:hover{color:var(--txt)}
.lockbox .btns button.ok:hover{color:#000}
.item.locked .lbl::after{content:" 🔒"}
#home .btns button.locked::after{content:" 🔒"}
</style>
</head>
<body>
<div id="lockModal">
  <div class="lockbox">
    <div class="ico">🔒</div>
    <h3 id="lockTitle">Área restrita</h3>
    <div class="sub" id="lockSub">Digite a senha do setor</div>
    <input type="password" id="lockPass" inputmode="numeric" autocomplete="off" placeholder="••••••">
    <div class="err" id="lockErr"></div>
    <div class="btns">
      <button id="lockCancel">Cancelar</button>
      <button class="ok" id="lockOk">Entrar</button>
    </div>
  </div>
</div>
<div id="fin-embed" style="display:none">
<div id="oc-contas"></div>
<template id="oc-contas-tpl">
<style>

:host{
  --bg:#eef1f5; --card:#ffffff; --ink:#0f1a25; --muted:#667085; --line:#e3e7ee;
  --pay:#b42318; --pay-soft:#fef3f2; --rec:#067647; --rec-soft:#ecfdf3;
  --navy:#0b1b2b; --navy2:#132b40; --accent:#1d4ed8; --amber:#b54708; --amber-soft:#fffaeb;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.12);
  all: initial;
  color: var(--ink);
  font-family: -apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-size: 14px;
  line-height: 1.45;
  display: block;
}
*{box-sizing:border-box}
.wrap{max-width:1500px;margin:0 auto;padding:0 22px 56px}
/* ---------- topbar ---------- */
.top{margin-bottom:26px}
.top-in{max-width:1500px;margin:0 auto;padding:6px 22px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#ffd400;font-weight:700}
h1{font-size:26px;line-height:1.15;margin:6px 0 4px;font-weight:700;letter-spacing:-.02em;color:#fff}
.sub{color:#9a9a9a;font-size:13px}
.top-right{text-align:right;font-size:12px;color:#9a9a9a;line-height:1.7}
.top-right b{color:#fff;font-size:13px}
/* ---------- generic card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-s{font-size:12px;color:var(--muted);margin-top:2px}
h2.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#475467;margin:30px 0 12px;font-weight:700}
/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.kpi.pay:before{background:var(--pay)} .kpi.rec:before{background:var(--rec)}
.kpi.net:before{background:var(--accent)} .kpi.warn:before{background:var(--amber)}
.kpi-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi-v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:7px 0 3px;white-space:nowrap}
.kpi-s{font-size:11.5px;color:var(--muted)}
.kpi-s b{color:#344054}
.pos{color:var(--rec)} .neg{color:var(--pay)}
/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.navbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:#344054;display:flex;align-items:center;justify-content:center}
.navbtn:hover{background:#f7f9fc;border-color:#cfd6e0}
input[type=date],input[type=text],select{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:inherit;font-size:13px;color:var(--ink);background:#fff}
input[type=text]{min-width:190px}
input[type=date]:focus,input[type=text]:focus,select:focus{outline:2px solid #c7d7fe;border-color:#84adff}
.btn{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#344054;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:#f7f9fc}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.dark:hover{background:#17324a}
.btn.sm{height:29px;font-size:12px;padding:0 10px}
.seg{display:inline-flex;background:#f2f4f7;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{height:27px;padding:0 11px;border:0;background:transparent;border-radius:6px;font:inherit;font-size:12.5px;font-weight:600;color:#475467;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
/* ---------- main grid ---------- */
.grid{display:grid;grid-template-columns:352px minmax(0,1fr);gap:14px;align-items:start}
/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-weight:700;font-size:14px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:10px;text-align:center;color:#98a2b3;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
.day{position:relative;border:1px solid transparent;border-radius:9px;background:#f8fafc;padding:5px 4px 4px;text-align:center;cursor:pointer;min-height:52px;transition:background .1s}
.day:hover{background:#eef4fb;border-color:#d3e0f0}
.day.out{opacity:.34}
.day.today{background:#fff7ed;border-color:#f9d5a7}
.day.sel{border-color:var(--navy);background:#eaf1f8;box-shadow:inset 0 0 0 1px var(--navy)}
.day .n{font-size:12px;font-weight:700;color:#344054;line-height:1.1}
.day.today .n{color:var(--amber)}
.day .bars{display:flex;gap:2px;justify-content:center;align-items:flex-end;height:26px;margin-top:4px}
.day .b{width:7px;border-radius:2px 2px 0 0;min-height:1px}
.day .b.p{background:#e9a5a0} .day .b.r{background:#8fd3b4}
.day .amt{font-size:8.5px;color:#667085;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* ---------- period ---------- */
.per-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.per-date{font-size:19px;font-weight:700;letter-spacing:-.02em}
.per-sum{display:flex;gap:22px;flex-wrap:wrap;margin-top:4px}
.per-sum div{font-size:12px;color:var(--muted)}
.per-sum b{display:block;font-size:16px;letter-spacing:-.01em;margin-top:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:grid;grid-template-columns:1fr;gap:14px}
.tbl-wrap{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:#f8fafc;z-index:2;text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#667085;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th.num{text-align:right}
tbody td{padding:7px 10px;border-bottom:1px solid #f1f3f7;vertical-align:top}
tbody tr:hover{background:#fafbfd}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
td.dt{white-space:nowrap;color:#475467;font-variant-numeric:tabular-nums}
td.nm{max-width:230px}
td.nm .s{display:block;font-size:10.5px;color:#98a2b3;margin-top:1px;text-transform:none}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;letter-spacing:.02em}
.pill.ov{background:var(--pay-soft);color:var(--pay)}
.pill.soon{background:var(--amber-soft);color:var(--amber)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:9px 11px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;margin-bottom:9px}
.tot span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tot b{font-size:17px;letter-spacing:-.01em}
.empty{padding:26px 12px;text-align:center;color:#98a2b3;font-size:12.5px}
/* ---------- charts ---------- */
.charts{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;margin-top:14px}
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:10px;fill:#98a2b3}
.axl{font-size:11px;fill:#667085;font-weight:600}
.zl{stroke:#d0d5dd;stroke-dasharray:4 3}
/* ---------- aging ---------- */
.aging td, .aging th{padding:7px 9px}
.bar-cell{position:relative;min-width:120px}
.bar-cell .bg{position:absolute;inset:6px 9px 6px 9px;border-radius:3px;background:#f2f4f7}
.bar-cell .fg{position:absolute;left:9px;top:9px;bottom:9px;border-radius:3px;opacity:.85}
.bar-cell span{position:relative;z-index:1}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#f2f4f7;color:#475467;border:1px solid var(--line)}
.tag.r{background:var(--rec-soft);color:var(--rec);border-color:#d3f8df}
.tag.p{background:var(--pay-soft);color:var(--pay);border-color:#fee4e2}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f1f3f7;font-size:12.5px}
.toplist li:last-child{border:0}
.toplist .nm2{color:#344054;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist .vl{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toplist .ix{color:#98a2b3;font-size:11px;min-width:14px}
.footer{margin-top:34px;font-size:11.5px;color:#98a2b3;line-height:1.7;text-align:center}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)} .grid{grid-template-columns:1fr} .charts{grid-template-columns:1fr} .two{grid-template-columns:1fr}}
@media (max-width:620px){.kpis{grid-template-columns:1fr} h1{font-size:21px} .wrap{padding:0 12px 40px}}
</style>
<div class="top">
  <div class="top-in">
    <div>
      <div class="brand">Ovos Casagrande · Financeiro</div>
      <h1>Contas a Pagar e Receber</h1>
      <div class="sub">Posição dos títulos em aberto, atraso e projeção de caixa</div>
    </div>
    <div class="top-right">
      Base: relatório do ERP &nbsp;·&nbsp; <b id="baseDate">—</b><br>
      <span id="baseCounts">—</span><br>
      <span id="baseWarn" style="display:none;background:#7a271a;color:#fff;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.03em"></span>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="kpis" id="kpis"></div>

  <h2 class="sec">Navegar por dia</h2>
  <div class="grid">
    <!-- CALENDAR -->
    <div class="card">
      <div class="cal-head">
        <button class="navbtn" id="calPrev" title="Mês anterior">‹</button>
        <div class="cal-month" id="calMonth">—</div>
        <button class="navbtn" id="calNext" title="Mês seguinte">›</button>
      </div>
      <div class="cal" id="calGrid"></div>
      <div class="legend">
        <span><i style="background:#e9a5a0"></i>A pagar</span>
        <span><i style="background:#8fd3b4"></i>A receber</span>
        <span><i style="background:#fff7ed;border:1px solid #f9d5a7"></i>Hoje</span>
      </div>
      <div class="note">Clique em qualquer dia para ver a agenda de pagamentos e recebimentos. As barras mostram o volume relativo de cada dia.</div>
    </div>

    <!-- PERIOD DETAIL -->
    <div class="card">
      <div class="toolbar" style="margin-bottom:14px">
        <button class="navbtn" id="prevBtn" title="Período anterior">‹</button>
        <button class="navbtn" id="nextBtn" title="Período seguinte">›</button>
        <input type="date" id="dateInput">
        <button class="btn" id="todayBtn">Hoje</button>
        <div class="seg" id="modeSeg">
          <button data-mode="dia" class="on">Dia</button>
          <button data-mode="semana">Semana</button>
          <button data-mode="mes">Mês</button>
          <button data-mode="periodo">Período</button>
        </div>
        <span id="rangeWrap" style="display:none;gap:8px;align-items:center">
          <input type="date" id="fromInput"> <span style="color:#98a2b3">até</span> <input type="date" id="toInput">
        </span>
        <input type="text" id="q" placeholder="Buscar fornecedor ou cliente…" style="margin-left:auto">
      </div>

      <div class="per-head">
        <div>
          <div class="per-date" id="perDate">—</div>
          <div class="per-sum" id="perSum"></div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn sm" id="csvBtn">Exportar CSV</button>
        </div>
      </div>

      <div class="stack">
        <div>
          <div class="tot"><span>A pagar · <i id="payN">0</i> títulos</span><b class="neg" id="payTotal">R$ 0</b></div>
          <div class="tbl-wrap">
            <table id="payTable">
              <thead><tr>
                <th data-sort="v">Venc.</th><th data-sort="f">Fornecedor</th>
                <th data-sort="c">Conta</th><th data-sort="val" class="num">Valor</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>

    if (a >= 1e3) return 'R$ ' + (v/1e3).toFixed(a>=1e4?0:1).replace('.',',') + ' mil';

  /* ---------- period logic ---------- */
  function period(){
    const r = state.ref;

  function calRender(){

    const first = new Date(y, m, 1, 12);
    const start = addDays(first, -((first.getDay()+6)%7));
    const days = [];
    for (let i=0;i<42;i++) days.push(addDays(start, i));

        <td class="nm">${esc(x.f)}${x.ref?'<span class="s">'+esc(x.ref)+'</span>':''}</td>
        <td class="nm" style="font-size:11.5px;color:#475467">${esc(x.c)}${(x.cc && x.cc.toLowerCase()!==(x.c||'').toLowerCase())?'<span class="s">'+esc(x.cc)+'</span>':''}</td>
        <td class="num neg">${money(x.val)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4"><div class="empty">Nenhum pagamento no período.</div></td></tr>';

    doc.querySelector('#recTable tbody').innerHTML = rec.length ? rec.map(x=>{
      const late = x.v < TODAY_ISO;
      return `<tr>
        <td class="dt">${fmtds(x.d)}${late?' <span class="pill ov">atraso</span>':''}</td>
        <td class="nm">${esc(x.n)}${x.ped?'<span class="s">Pedido '+esc(x.ped)+(x.tit?' · título '+esc(x.tit):'')+'</span>':''}</td>
        <td class="nm" style="font-size:11.5px;color:#475467">${esc(x.t)}${x.sb?' · '+esc(x.sb):''}</td>
        <td class="num pos">${money(x.val)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4"><div class="empty">Nenhum recebimento no período.</div></td></tr>';

    // store for csv
    state.curPay = pay; state.curRec = rec; state.curLabel = periodLabel(a,b);
  }

  /* ---------- charts ---------- */
  function renderProj(){
    const [a,b] = period();
    const start = TODAY;
    const h = 90;
    const end = addDays(start, h);
    const map = {};
    for (let i=0;i<=h;i++) map[key(addDays(start,i))] = {p:0,r:0};
    PAY.forEach(x=>{ if (x.d >= start && x.d < end && map[x.v]) map[x.v].p += x.val; });
    REC.forEach(x=>{ if (x.d >= start && x.d < end && map[x.v]) map[x.v].r += x.val; });
    const keys = Object.keys(map);
    let acc = 0; const cum = []; const dailyP = [], dailyR = [];
    keys.forEach(k=>{ acc += map[k].r - map[k].p; cum.push(acc); dailyP.push(map[k].p); dailyR.push(map[k].r); });

    const W=900, H=300, L=64, R=16, T=18, B=34;
    const iw = W-L-R, ih = H-T-B;
    const min = Math.min(0, ...cum), max = Math.max(0, ...cum);
    const span = (max-min)||1;
    const x = i => L + i/(keys.length-1)*iw;
    const y = v => T + ih - (v-min)/span*ih;
    const zero = y(0);

    // grid
    let grid = '';
    const ticks = 4;
    for (let i=0;i<=ticks;i++){
      const v = min + span*i/ticks;
      grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f5"/>
               <text x="${L-8}" y="${y(v)+3.5}" text-anchor="end" class="ax">${compact(v).replace('R$ ','')}</text>`;
    }
    // area
    let dLine = '';
    cum.forEach((v,i)=>{ dLine += (i?'L':'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; });
    const dArea = dLine + `L ${x(cum.length-1).toFixed(1)} ${zero.toFixed(1)} L ${x(0).toFixed(1)} ${zero.toFixed(1)} Z`;
    // x labels every 15 days
    let xl = '';
    keys.forEach((k,i)=>{ if (i%15===0 || i===keys.length-1){ const dd = addDays(start,i); xl += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" class="ax">${fmtds(dd)}</text>`; } });

    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#067647" stop-opacity=".22"/><stop offset="100%" stop-color="#067647" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <line x1="${L}" x2="${W-R}" y1="${zero}" y2="${zero}" class="zl"/>
      <path d="${dArea}" fill="url(#g1)"/>
      <path d="${dLine}" fill="none" stroke="#067647" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="${x(cum.length-1)}" cy="${y(cum[cum.length-1])}" r="4.5" fill="#067647"/>
      <text x="${x(cum.length-1)-6}" y="${y(cum[cum.length-1])-12}" text-anchor="end" class="axl" fill="#067647">${compact(cum[cum.length-1])}</text>
      ${xl}
    </svg>`;

    doc.getElementById('projChart').innerHTML = svg;
    const last = cum[cum.length-1];
    doc.getElementById('projSub').textContent = `De ${fmtd(start)} a ${fmtd(addDays(start,h-1))} · apenas títulos com vencimento no período`;
    doc.getElementById('projNote').innerHTML = last>=0
      ? `Se todos os títulos vencerem e forem liquidados no prazo, o caixa acumulado chega a <b class="pos">${money(last)}</b> em 90 dias.`
      : `Atenção: mantido o prazo atual, o caixa acumulado fica <b class="neg">${money(last)}</b> em 90 dias — as saídas superam as entradas.`;
    if (key(a)===key(b)) { /* noop */ }
  }

  function renderWeeks(){
    const start = TODAY;
    const weeks = 13;
    const buckets = [];
    for (let w=0; w<weeks; w++){
      const s = addDays(start, w*7), e = addDays(s, 7);
      buckets.push({s, e, p:0, r:0});
    }
    PAY.forEach(x=>{ const i = Math.floor(daysBetween(start, x.d)/7); if (i>=0 && i<weeks) buckets[i].p += x.val; });
    REC.forEach(x=>{ const i = Math.floor(daysBetween(start, x.d)/7); if (i>=0 && i<weeks) buckets[i].r += x.val; });

    const W=900,H=300,L=64,R=16,T=18,B=42;
    const iw=W-L-R, ih=H-T-B;
    const max = Math.max(...buckets.map(b=>Math.max(b.p,b.r)))||1;
    const y = v => T + ih - v/max*ih;
    const bw = iw/weeks;
    let bars='', xl='', grid='';
    for (let i=0;i<=4;i++){ const v=max*i/4; grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f5"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end" class="ax">${compact(v).replace('R$ ','')}</text>`; }
    buckets.forEach((b,i)=>{
      const cx = L + i*bw + bw/2;
      const w2 = Math.max(5, bw*0.30);
      const hp = b.p/max*ih, hr = b.r/max*ih;
      bars += `<rect x="${cx-w2-1.5}" y="${y(b.p)}" width="${w2}" height="${Math.max(0,hp)}" fill="#d96a5f" rx="2"><title>Semana ${fmtds(b.s)}–${fmtds(addDays(b.e,-1))} · a pagar ${money0(b.p)}</title></rect>`;
      bars += `<rect x="${cx+1.5}" y="${y(b.r)}" width="${w2}" height="${Math.max(0,hr)}" fill="#3fa87b" rx="2"><title>Semana ${fmtds(b.s)}–${fmtds(addDays(b.e,-1))} · a receber ${money0(b.r)}</title></rect>`;
      if (i%2===0) xl += `<text x="${cx}" y="${H-18}" text-anchor="middle" class="ax">${fmtds(b.s)}</text>`;
    });
    doc.getElementById('weekChart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}
      <line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="#e4e7ec"/>${bars}${xl}</svg>`;
  }

  /* ---------- aging ---------- */
  const BUCKETS = [
    {l:'1 a 30 dias', min:1, max:30},
    {l:'31 a 60 dias', min:31, max:60},
    {l:'61 a 90 dias', min:61, max:90},
    {l:'91 a 180 dias', min:91, max:180},
    {l:'acima de 180', min:181, max:99999}
  ];
  function aging(items, totalOut, tbodyId, totId, subId, color){
    const ov = items.filter(x=>x.d < state.ref);
    const sum = ov.reduce((s,x)=>s+x.val,0);
    const rows = BUCKETS.map(b=>{
      const arr = ov.filter(x=>{ const dd = daysBetween(x.d, state.ref); return dd>=b.min && dd<=b.max; });
      return {l:b.l, n:arr.length, v:arr.reduce((s,x)=>s+x.val,0), items:arr};
    });
    const notDue = items.filter(x=>x.d >= state.ref);
    const maxV = Math.max(...rows.map(r=>r.v), 1);
    let html = `<thead><tr><th>Faixa</th><th class="num">Títulos</th><th class="num">Valor</th><th style="min-width:110px">% do vencido</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const pct = sum? r.v/sum*100 : 0;
      html += `<tr>
        <td>${r.l}</td>
        <td class="num">${NUM.format(r.n)}</td>
        <td class="num">${r.v?money0(r.v):'—'}</td>
        <td class="bar-cell"><div class="bg"></div><div class="fg" style="width:${(r.v/maxV*88).toFixed(1)}%;background:${color}"></div><span style="font-size:11px;color:#475467">${pct.toFixed(0)}%</span></td>
      </tr>`;
    });
    html += `</tbody>`;
    doc.getElementById(tbodyId).innerHTML = html;
    doc.getElementById(totId).textContent = money(sum);
    doc.getElementById(subId).textContent = `${NUM.format(ov.length)} de ${NUM.format(items.length)} títulos · ${(sum/totalOut*100).toFixed(1).replace('.',',')}% do saldo em aberto · a vencer ${compact(notDue.reduce((s,x)=>s+x.val,0))}`;
    return ov;
  }
  function topList(ov, kind){
    const g = {};
    ov.forEach(x=>{ const k = kind==='pay'? x.f : x.n; g[k] = (g[k]||0) + x.val; });
    const arr = Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return arr.map(([k,v],i)=>`<li><span class="ix">${i+1}</span><span class="nm2" title="${esc(k)}">${esc(k)}</span><span class="vl">${money0(v)}</span></li>`).join('') || '<li style="color:#98a2b3">Nenhum título vencido.</li>';
  }
  function renderAging(){
    const payOv = aging(PAY, PAY.reduce((s,x)=>s+x.val,0), 'agingPay', 'agingPayTot', 'agingPaySub', '#d96a5f');
    const recOv = aging(REC, REC.reduce((s,x)=>s+x.val,0), 'agingRec', 'agingRecTot', 'agingRecSub', '#3fa87b');
    doc.getElementById('topCreditors').innerHTML = topList(payOv, 'pay');
    doc.getElementById('topDebtors').innerHTML = topList(recOv, 'rec');
  }

  /* ---------- insights ---------- */
  function renderInsights(){
    const payOpen = PAY.reduce((s,x)=>s+x.val,0);
    const recOpen = REC.reduce((s,x)=>s+x.val,0);
    const payOv = PAY.filter(x=>x.d < TODAY);
    const recOv = REC.filter(x=>x.d < TODAY);
    const payOvS = payOv.reduce((s,x)=>s+x.val,0);
    const recOvS = recOv.reduce((s,x)=>s+x.val,0);
    const socio = payOv.filter(x=>/CASAGRANDE JUNIOR/i.test(x.f)).reduce((s,x)=>s+x.val,0);

    const items = [
      {t:'O atraso está do lado do recebimento', d:`${compact(recOvS)} vencidos a receber (${(recOvS/recOpen*100).toFixed(1).replace('.',',')}% da carteira) contra apenas ${compact(payOvS)} a pagar — dos quais ${compact(socio)} são retirada/empréstimo do sócio. O caixa está sendo financiado pelos clientes em atraso.`, tone:'p'},
      {t:'Concentração de risco', d:`Os 3 maiores clientes somam ${compact(top3s)} (${(top3s/recOpen*100).toFixed(0)}% do a receber): ${top3.map(x=>esc(x[0].split(' ').slice(0,2).join(' '))).join(', ')}.`, tone:''},
      {t:'Cobrança antiga parada', d:`${NUM.format(longRec.length)} títulos com mais de 1 ano somam ${compact(longRecS)} — provável recuperação judicial de crédito; avaliar baixa ou ação de cobrança.`, tone: longRecS>0?'p':''},
      {t:'Próximos 30 dias', d:`A pagar ${compact(p30)} x a receber ${compact(r30)} → saldo ${(r30-p30)>=0?'positivo':'negativo'} de ${compact(Math.abs(r30-p30))}. Novembro concentra ${(REC.filter(x=>x.v>='2026-11-01'&&x.v<='2026-11-30').reduce((s,x)=>s+x.val,0)/recOpen*100).toFixed(0)}% do a receber do ano.`, tone: (r30-p30)>=0?'r':'p'},
      {t:'Passivo financeiro pesa no longo prazo', d:`${compact(fin)} em empréstimo Itaú, consórcio e veículos (${(fin/payOpen*100).toFixed(0)}% do a pagar), com parcelas até 2034. O operacional (fornecedores, insumos, combustível) é ${compact(payOpen-fin)}.`, tone:''}
    ];

      doc.getElementById('movBox').innerHTML =
        bloco('receber','A receber','#067647') + bloco('pagar','A pagar','#b42318') + veredito;

  function fmtShort(s){ const [y,m,d] = s.split('-'); return d+'/'+m+'/'+y.slice(2); }
  function csvHist(){
    const H = DATA.historico || [];
    const rows = [['Data','A pagar','Pagar vencido','A receber','Receber vencido','Atraso liquido','Delta receber','Delta pagar','Liquido 30d']];
    H.forEach(h=>rows.push([fmtShort(h.base_date), h.pagar_total, h.pagar_vencido, h.receber_total, h.receber_vencido,
      (h.receber_vencido-h.pagar_vencido), h.d_receber_vencido==null?'':h.d_receber_vencido, h.d_pagar_vencido==null?'':h.d_pagar_vencido, h.liquido_30d||0]));
    const csv = '\ufeff' + rows.map(r=>r.map(c=>'"'+String(c).replace('.',',')+'"').join(';')).join('\r\n');
    const b = new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a = doc.createElement('a'); a.href = URL.createObjectURL(b); a.download='historico_contas.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }

  /* ---------- csv ---------- */
  function csvExport(){
    const rows = [['Tipo','Vencimento','Nome','Categoria','Centro de custo','Referencia','Valor']];
    (state.curPay||[]).forEach(x=>rows.push(['Pagar', fmtd(x.d), x.f, x.c, x.cc||'', x.ref||'', String(x.val).replace('.',',')]));
    (state.curRec||[]).forEach(x=>rows.push(['Receber', fmtd(x.d), x.n, x.t, x.sb||'', x.ped?('Pedido '+x.ped):'', String(x.val).replace('.',',')]));
    const csv = '\ufeff' + rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = doc.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'contas_' + state.curLabel.replace(/[^\d\w]+/g,'_') + '.csv';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  }

  /* ---------- sync / render ---------- */
  function syncInputs(){
    doc.getElementById('dateInput').value = key(state.ref);
    doc.getElementById('fromInput').value = key(state.from);
    doc.getElementById('toInput').value = key(state.to);
    state.calMonth = new Date(state.ref.getFullYear(), state.ref.getMonth(), 1, 12);
  }
  function renderAll(){
    calRender(); renderPeriod(); renderAging(); renderInsights(); renderHist();
  }
  function boot(){
    kpiRender(); renderProj(); renderWeeks(); syncInputs(); renderAll();

    doc.getElementById('prevBtn').onclick = ()=>{
      const [a] = period();
      if (state.mode==='dia') state.ref = addDays(state.ref,-1);
      else if (state.mode==='semana') state.ref = addDays(state.ref,-7);
      else if (state.mode==='mes') state.ref = new Date(state.ref.getFullYear(), state.ref.getMonth()-1, 1, 12);
      else { const n = daysBetween(state.from,state.to)+1; state.from = addDays(state.from,-n); state.to = addDays(state.to,-n); state.ref = state.from; }
      syncInputs(); renderAll();
    };
    doc.getElementById('nextBtn').onclick = ()=>{
      if (state.mode==='dia') state.ref = addDays(state.ref,1);
      else if (state.mode==='semana') state.ref = addDays(state.ref,7);
      else if (state.mode==='mes') state.ref = new Date(state.ref.getFullYear(), state.ref.getMonth()+1, 1, 12);
      else { const n = daysBetween(state.from,state.to)+1; state.from = addDays(state.from,n); state.to = addDays(state.to,n); state.ref = state.from; }
      syncInputs(); renderAll();
    };
    doc.getElementById('todayBtn').onclick = ()=>{
      state.ref = iso(TODAY_ISO);
      if (state.mode==='periodo'){ state.from = addDays(state.ref,-30); state.to = state.ref; }
      syncInputs(); renderAll();
    };
    doc.getElementById('dateInput').onchange = e=>{ if(e.target.value){ const prev = state.ref; state.ref = iso(e.target.value); if(state.mode==='periodo'){ const n = daysBetween(state.from,state.to); state.to = state.ref; state.from = addDays(state.ref,-Math.max(0,n)); } syncInputs(); renderAll(); } };
    doc.getElementById('fromInput').onchange = e=>{ if(e.target.value){ state.from = iso(e.target.value); state.ref = state.from; renderAll(); } };
    doc.getElementById('toInput').onchange = e=>{ if(e.target.value){ state.to = iso(e.target.value); state.ref = state.from; renderAll(); } };
    doc.getElementById('calPrev').onclick = ()=>{ state.calMonth = addMonths(state.calMonth,-1); calRender(); };
    doc.getElementById('calNext').onclick = ()=>{ state.calMonth = addMonths(state.calMonth,1); calRender(); };
    doc.querySelectorAll('#modeSeg button').forEach(btn=>{
      btn.onclick = ()=>{
        state.mode = btn.dataset.mode;
        doc.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on', b===btn));
        doc.getElementById('rangeWrap').style.display = state.mode==='periodo' ? 'inline-flex' : 'none';
        if (state.mode==='periodo'){ state.from = addDays(state.ref,-30); state.to = state.ref; syncInputs(); }
        renderAll();
      };
    });
    doc.getElementById('q').oninput = e=>{ state.q = e.target.value; renderPeriod(); };
    doc.getElementById('csvBtn').onclick = csvExport;
    doc.getElementById('csvHist').onclick = csvHist;
    doc.querySelectorAll('#payTable th[data-sort]').forEach(th=>{
      th.onclick = ()=>{ const k = th.dataset.sort; state.sortPay = {k, dir: state.sortPay.k===k ? -state.sortPay.dir : -1}; renderPeriod(); };
    });
    doc.querySelectorAll('#recTable th[data-sort]').forEach(th=>{
      th.onclick = ()=>{ const k = th.dataset.sort; state.sortRec = {k, dir: state.sortRec.k===k ? -state.sortRec.dir : -1}; renderPeriod(); };
    });
  }
  boot();
})();
</script>

async function sha256(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ===== controle de acesso por setor ===== */
const unlocked = {}; // {prod: true, ...} — em memória (ao recarregar, pede de novo)
let pendingDept = null;
const lockModal = el('lockModal'), lockPass = el('lockPass'), lockErr = el('lockErr');
function pedirSenha(did){
  pendingDept = did;
  const d = DEPTS.find(x=>x.id==did);
  el('lockTitle').textContent = d.nome;
  el('lockSub').textContent = 'Digite a senha do setor para acessar';
  lockErr.textContent = '';
  lockPass.value = '';
  lockModal.classList.add('on');
  setTimeout(()=>lockPass.focus(), 50);
}
async function confirmarSenha(){
  if(!pendingDept) return;
  const h = await sha256(lockPass.value);
  if(h === SENHAS[pendingDept]){
    unlocked[pendingDept] = true;
    lockModal.classList.remove('on');
    const did = pendingDept; pendingDept = null;
    openDept(did);
  } else {
    lockErr.textContent = 'Senha incorreta — tente novamente';
    lockPass.value = '';
    lockPass.focus();
  }
}
el('lockOk').onclick = confirmarSenha;
lockPass.onkeydown = e => { if(e.key=='Enter') confirmarSenha(); };
el('lockCancel').onclick = ()=>{ lockModal.classList.remove('on'); pendingDept=null; };
lockModal.onclick = e => { if(e.target==lockModal){ lockModal.classList.remove('on'); pendingDept=null; } };
function tryOpen(did){
  if(unlocked[did] || !SENHAS[did]) openDept(did);
  else pedirSenha(did);
}

function chart(id, h){ return `<div class="chartbox ${h||''}"><canvas id="${id}"></canvas></div>`; }
function tabela(rows, cols){ return '<table><tr>'+cols.map(c=>`<th class="${c.num?'num':''}">${c.t}</th>`).join('')+'</tr>'+

/* ----- filtro de período (dia / semana do mês / mês) ----- */
function isoWeek(dt){ const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())); const dn=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-dn); const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil((((d-ys)/86400000)+1)/7); }
function periodoDe(filtro){
  // retorna {label, datas:[...], totais:{data:total}, itemsAgg:{cod:{compra,cx}}}
  const serie = COMP.serie;
  const byDay = {}; serie.forEach(s=>byDay[s.data]=s.total);
  let datas = [], label = '';
  if(filtro.modo=='dia'){ datas=[filtro.data]; label = filtro.data.slice(8,10)+'/'+filtro.data.slice(5,7)+'/'+filtro.data.slice(0,4); }
  else if(filtro.modo=='mes'){ datas = serie.filter(s=>s.data.slice(0,7)==filtro.mes).map(s=>s.data); label = MESN[+filtro.mes.slice(5,7)-1]+'/'+filtro.mes.slice(2,4); }
  else { // semana do mês: 1ª = dias 1-7, 2ª = 8-14, 3ª = 15-21, 4ª = 22-28, 5ª = 29-fim
    const [y,m] = [ +filtro.mes.slice(0,4), +filtro.mes.slice(5,7) ];
    datas = serie.filter(s=>{ const d = +s.data.slice(8,10);
      return s.data.slice(0,7)==filtro.mes && Math.ceil(d/7)==filtro.sem; }).map(s=>s.data);
    label = filtro.sem+'ª semana — '+MESN[m-1]+'/'+(''+y).slice(2,4);
  }
  const itemsAgg = {};
  datas.forEach(d=>{ (COMP.por_dia_items[d]||[]).forEach(it=>{
    const a = itemsAgg[it[0]] = itemsAgg[it[0]] || {compra:0, cx:0};
    a.compra += it[1]; a.cx += it[2]; }); });
  const total = datas.reduce((a,d)=>a+(byDay[d]||0),0);
  return {label, datas, total, itemsAgg};
}
function filtroHTML(id){ return `<div class="filtros" id="fl-${id}">
  <div class="fgroup">
    <button data-m="dia">Dia</button><button data-m="semana">Semana</button><button data-m="mes" class="on">Mês</button>
  </div>
  <span id="fl-dia-${id}" style="display:none"><input type="date" id="fl-date-${id}"></span>
  <span id="fl-sem-${id}" style="display:none">
    <select id="fl-mesS-${id}"></select>
    <select id="fl-wS-${id}"></select>
  </span>
  <span id="fl-mesF-${id}"><select id="fl-mesM-${id}"></select></span>
</div>`; }
function bindFiltro(id, onChange){
  const box = el('fl-'+id);
  const ref = COMP.ref;
  const meses = [...new Set(COMP.serie.map(s=>s.data.slice(0,7)))].sort().reverse();
  const optMes = meses.map(m=>`<option value="${m}">${MESN[+m.slice(5,7)-1]}/${m.slice(2,4)}</option>`).join('');
  // refletir FILTRO na UI
  box.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.m==FILTRO.modo));
  el('fl-dia-'+id).style.display = FILTRO.modo=='dia'?'inline':'none';
  el('fl-sem-'+id).style.display = FILTRO.modo=='semana'?'inline':'none';
  el('fl-mesF-'+id).style.display = FILTRO.modo=='mes'?'inline':'none';
  const mS = el('fl-mesS-'+id), wS = el('fl-wS-'+id), mM = el('fl-mesM-'+id), dI = el('fl-date-'+id);
  mS.innerHTML = optMes; mM.innerHTML = optMes;
  wS.innerHTML = [1,2,3,4,5].map(w=>`<option value="${w}">${w}ª semana</option>`).join('');
  mS.value = mM.value = FILTRO.mes; wS.value = FILTRO.sem||1;
  dI.value = FILTRO.data; dI.max = ref;
  const sync = (modoForcado)=>{
    const modo = modoForcado || box.querySelector('button.on').dataset.m;
    FILTRO = {modo,
      mes: (modo=='semana'? mS.value : mM.value),
      sem:+(wS.value||1), data: dI.value};
    onChange();
  };
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>sync(b.dataset.m));
  mS.onchange = wS.onchange = mM.onchange = dI.onchange = ()=>sync();
}

    {l:'Total no histórico', v:fmt(vals.reduce((a,b)=>a+b,0))+' cx', d:meses.length+' meses', cls:''},
    {l:'Melhor mês', v:fmt(Math.max(...vals))+' cx', d:MESN[+meses[vals.indexOf(Math.max(...vals))].slice(5,7)-1], cls:'up'},
  ]) + '<div class="card" style="margin-top:14px"><h2>Compras por mês (2025 → 2026)</h2>'+chart('cMes','tall')+'</div>';
  bar('cMes', meses.map(m=>m.slice(5,7)+'/'+m.slice(2,4)), vals, '#ffd400');
}

function renderComp360(box){
  const pm = COMP.por_mes_cx360;
  const meses = Object.keys(pm).sort();
  const vals = meses.map(m=>pm[m]);
  const best = meses[vals.indexOf(Math.max(...vals))];
  const ordemF = ['200','240','280','360','60'];
  const total360 = COMP.total360_mes;
  box.innerHTML = kpis([
    {l:'Comprado no mês (cx de 360)', v:fmt(Math.round(total360))+' cx', d:COMP.ref.slice(5,7)+'/'+COMP.ref.slice(0,4), cls:''},
    {l:'Mês recorde (cx de 360)', v:fmt(Math.round(Math.max(...vals)))+' cx', d:MESN[+best.slice(5,7)-1]+'/'+best.slice(2,4), cls:'up'},
    {l:'Média mensal (cx de 360)', v:fmt(Math.round(vals.reduce((a,b)=>a+b,0)/vals.length))+' cx', d:meses.length+' meses', cls:'mut'},
  ]) +
  '<div class="card" style="margin-top:14px"><h2>Caixas equivalentes de 360 — por mês <span style="color:var(--mut);text-transform:none;letter-spacing:0">· clique numa barra para ver a composição</span></h2>'+chart('cCx360','tall')+'</div>'+
  '<div id="c360Comp" style="margin-top:14px"></div>';
  let selIdx = meses.indexOf(COMP.ref.slice(0,7));
  const ch = new Chart(el('cCx360'),{type:'bar',data:{labels:meses.map(m=>MESN[+m.slice(5,7)-1]+'/'+m.slice(2,4)),datasets:[{data:vals,backgroundColor:meses.map((_,i)=>i===selIdx?'#ffffff':'#ffd400'),borderRadius:6}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}},
      onHover:(e,els)=>{ e.native.target.style.cursor = els.length?'pointer':'default'; },
      onClick:(e,els)=>{ if(!els.length) return; const i=els[0].index; selIdx=i; ch.data.datasets[0].backgroundColor = meses.map((_,j)=>j===i?'#ffffff':'#ffd400'); ch.update(); mostrarComp(meses[i]); }}});
  function mostrarComp(ym){
    const comp = (COMP.comp_por_mes||{})[ym] || {};
    const ordem = ordemF.filter(f=>comp[f]!==undefined)
      .concat(Object.keys(comp).filter(f=>!ordemF.includes(f)));
    const nome = MESN[+ym.slice(5,7)-1]+'/'+ym.slice(2,4);
    const totOvos = Object.values(comp).reduce((a,b)=>a+b.ovos,0);
    const tot360 = Math.round(totOvos/360);
    el('c360Comp').innerHTML = '<div class="card"><h2>Composição de '+nome+' — como no Excel (TIPO × CAIXAS × OVOS)</h2>'+
      tabela(ordem, [
        {t:'Tipo (ovos/caixa)', f:r=>r},
        {t:'Caixas compradas', num:1, f:r=>fmt(comp[r].caixas)},
        {t:'Total de ovos', num:0, f:r=>fmt(comp[r].ovos)},
        {t:'= Caixas de 360', num:1, f:r=>fmt(Math.round(comp[r].ovos/360))},
      ]) +
      '<div style="display:flex;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">'+
      '<div style="font-size:15px"><b>Total geral: '+fmt(tot360)+' cx de 360</b></div></div>'+
      '<div class="note">Cálculo: caixas compradas × ovos por caixa = total de ovos → ÷ 360 = caixas equivalentes de 360.</div></div>';
    window.scrollTo({top:el('c360Comp').offsetTop-80});
  }
  mostrarComp(COMP.ref.slice(0,7));
}

function renderCompRank(box){
  const serie = COMP.serie;
  const porMes = {}; // ym -> total
  const porSem = {}; // ym-W -> {total, dias:[data]}
  const porDia = {}; // data -> total
  serie.forEach(s=>{ porMes[s.data.slice(0,7)] = (porMes[s.data.slice(0,7)]||0)+s.total; });
  serie.forEach(s=>{
    const dt = new Date(s.data+'T12:00:00');
    const w = ISO_WEEK(dt);
    const k = s.data.slice(0,7)+'-S'+w;
    porSem[k] = porSem[k] || {total:0, mes:s.data.slice(0,7), w};
    porSem[k].total += s.total;
  });
  serie.forEach(s=>{ porDia[s.data] = s.total; });
  const rankM = Object.entries(porMes).sort((a,b)=>b[1]-a[1]);
  const rankS = Object.entries(porSem).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const rankD = Object.entries(porDia).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const mesNome = ym => MESN[+ym.slice(5,7)-1]+'/'+ym.slice(2,4);
  box.innerHTML = kpis([
    {l:'Mês com mais compras', v:fmt(rankM[0][1])+' cx', d:mesNome(rankM[0][0]), cls:'up'},
    {l:'Semana recorde', v:fmt(rankS[0][1].total)+' cx', d:'S'+rankS[0][1].w+' de '+mesNome(rankS[0][1].mes), cls:'up'},
    {l:'Maior dia', v:fmt(rankD[0][1])+' cx', d:rankD[0][0].slice(8,10)+'/'+rankD[0][0].slice(5,7)+'/'+rankD[0][0].slice(0,4), cls:'up'},
  ]) +
  '<div class="grid row3" style="margin-top:14px">'+
    card('🏆 Ranking por mês', tabela(rankM, [{t:'#',f:r=>rankM.indexOf(r)+1},{t:'Mês',f:r=>mesNome(r[0])},{t:'Caixas',num:1,f:r=>fmt(r[1])}]))+
    card('🏆 Top 12 semanas', tabela(rankS, [{t:'#',f:r=>rankS.indexOf(r)+1},{t:'Semana',f:r=>'S'+r[1].w+' · '+mesNome(r[1].mes)},{t:'Caixas',num:1,f:r=>fmt(r[1].total)}]))+
    card('🏆 Top 15 dias', tabela(rankD, [{t:'#',f:r=>rankD.indexOf(r)+1},{t:'Dia',f:r=>r[0].slice(8,10)+'/'+r[0].slice(5,7)+'/'+r[0].slice(0,4)},{t:'Caixas',num:1,f:r=>fmt(r[1])}]))+
  '</div>';
}
function ISO_WEEK(dt){
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function renderCompCal(box){
  const serie = COMP.serie;
  const totalBy = {}; serie.forEach(s=>totalBy[s.data]=s.total);
  const hoje = COMP.ref;
  let ano = +hoje.slice(0,4), mes = +hoje.slice(5,7); // 1-12
  let sel = {tipo:'mes', valor: hoje.slice(0,7)}; // mes | semana | dia
  box.innerHTML = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px">'+
    '<div style="display:flex;align-items:center;gap:10px">'+
      '<button id="calPrev" class="calnav">‹</button>'+
      '<h2 id="calTitle" style="margin:0"></h2>'+
      '<button id="calNext" class="calnav">›</button>'+
    '</div>'+
    '<div id="calInfo" class="sub"></div>'+
  '</div><div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div>'+
  '<div class="note">Clique num dia para ver as compras daquele dia · clique no número da semana (à esquerda) para ver a semana inteira</div></div>'+
  '<div id="calDet" style="margin-top:14px"></div>';
  const st = document.createElement('style');
  st.textContent = `.calnav{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px}
  .calnav:hover{border-color:var(--acc)}
  .cal-dow{color:var(--mut);font-size:10px;text-transform:uppercase;text-align:center;padding:4px 0}
  .cal-day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:6px 8px;cursor:pointer;position:relative;transition:.12s}
  .cal-day:hover{border-color:var(--acc)}
  .cal-day.out{opacity:.25;cursor:default}
  .cal-day.sel{border-color:var(--acc);background:rgba(255,212,0,.08)}
  .cal-day .n{font-size:11px;color:var(--mut)}
  .cal-day .v{font-size:12px;font-weight:700;margin-top:2px}
  .cal-day .w{position:absolute;top:4px;left:6px;font-size:9px;color:var(--acc);background:rgba(255,212,0,.12);border-radius:6px;padding:1px 6px;cursor:pointer}
  .cal-day.zero{color:var(--mut)}`;
  document.head.appendChild(st);
  const DIASW = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  function ymd(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function renderCal(){
    const first = new Date(ano, mes-1, 1);
    const startWd = (first.getDay()+6)%7; // segunda=0
    const ndays = new Date(ano, mes, 0).getDate();
    const nprev = new Date(ano, mes-1, 0).getDate();
    el('calTitle').textContent = MESN[mes-1]+' '+ano;
    let html = DIASW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    let cells = [];
    for(let i=startWd-1;i>=0;i--) cells.push({d:nprev-i, out:1});
    for(let d=1;d<=ndays;d++) cells.push({d});
    while(cells.length%7) cells.push({d:cells.length-startWd-ndays+1, out:1});
    cells.forEach((c,i)=>{
      if(i%7===0){ const dt = new Date(ano, mes-1, c.d||1); html += `<div style="display:flex;align-items:center;justify-content:center"><span class="w" data-w="${ISO_WEEK(dt)}" style="position:static;font-size:10px;color:var(--acc);cursor:pointer">S${ISO_WEEK(dt)}</span></div>`; }
      const ymd_ = c.out? null : ymd(ano,mes,c.d);
      const tot = ymd_ ? totalBy[ymd_] : null;
      const isSel = sel.tipo=='dia' && sel.valor==ymd_;
      html += `<div class="cal-day ${c.out?'out':''} ${isSel?'sel':''} ${tot===0?'zero':''}" ${c.out?'':`data-d="${ymd_}"`}>
        <div class="n">${c.d}</div><div class="v">${tot!=null?fmt(tot):'—'}</div></div>`;
    });
    el('calGrid').innerHTML = html;
    const mesTot = serie.filter(s=>s.data.slice(0,7)==ymd(ano,mes,0).slice(0,7)).reduce((a,b)=>a+b.total,0);
    const mesDias = serie.filter(s=>s.data.slice(0,7)==ymd(ano,mes,0).slice(0,7)).length;
    el('calInfo').textContent = 'Mês: '+fmt(mesTot)+' cx · '+mesDias+' dias com compra';
  }
  function showDia(d){
    sel = {tipo:'dia', valor:d};
    renderCal();
    const items = COMP.por_dia_items[d]||[];
    const info = COMP.cod_info;
    const tot = totalBy[d]||0;
    const rows = items.map(x=>({cod:x[0], desc:(info[x[0]]||['?'])[0], fab:(info[x[0]]||['','?'])[1], compra:x[1], cx:x[2]}))
      .filter(r=>r.cx>0).sort((a,b)=>b.cx-a.cx);
    el('calDet').innerHTML = '<div class="card"><h2>📅 '+d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4)+' — '+fmt(tot)+' caixas</h2>'+
      tabela(rows,[{t:'Cód',f:r=>r.cod},{t:'Produto',f:r=>r.desc},{t:'Granja',f:r=>r.fab},
        {t:'Unidades',num:1,f:r=>fmt(r.compra)},{t:'Caixas',num:1,f:r=>fmt(r.cx)}])+'</div>';
    window.scrollTo({top:document.getElementById('calDet').offsetTop-80});
  }
  function showSemana(w){
    // dias da semana w no mês visível
    const dias = serie.filter(s=>{ const dt=new Date(s.data+'T12:00:00');
      return ISO_WEEK(dt)==w && s.data.slice(0,7)==ymd(ano,mes,0).slice(0,7); });
    sel = {tipo:'semana', valor:w};
    renderCal();
    const tot = dias.reduce((a,b)=>a+b.total,0);
    el('calDet').innerHTML = '<div class="card"><h2>📅 Semana S'+w+' — '+fmt(tot)+' caixas</h2>'+
      '<div class="grid row3">'+ dias.map(x=>card(x.data.slice(8,10)+'/'+x.data.slice(5,7), '<div style="font-size:22px;font-weight:700">'+fmt(x.total)+' cx</div>')).join('')+'</div></div>'+
      '<div class="card" style="margin-top:14px"><h2>Itens da semana</h2>'+
      tabela((()=>{ const agg={}; dias.forEach(x=>{ (COMP.por_dia_items[x.data]||[]).forEach(it=>{ agg[it[0]]=agg[it[0]]||{cod:it[0],compra:0,cx:0}; agg[it[0]].compra+=it[1]; agg[it[0]].cx+=it[2]; }); });
        return Object.values(agg).map(x=>({...x, desc:(COMP.cod_info[x.cod]||['?'])[0], fab:(COMP.cod_info[x.cod]||['','?'])[1]})).filter(r=>r.cx>0).sort((a,b)=>b.cx-a.cx); })(),
        [{t:'Cód',f:r=>r.cod},{t:'Produto',f:r=>r.desc},{t:'Granja',f:r=>r.fab},{t:'Unidades',num:1,f:r=>fmt(r.compra)},{t:'Caixas',num:1,f:r=>fmt(r.cx)}])+'</div>';
  }
  el('calGrid').onclick = e => {
    const w = e.target.closest('.w'); if(w){ showSemana(+w.dataset.w); return; }
    const c = e.target.closest('.cal-day[data-d]'); if(c) showDia(c.dataset.d);
  };
  el('calPrev').onclick = ()=>{ mes--; if(mes==0){mes=12;ano--;} sel={tipo:'mes'}; renderCal(); el('calDet').innerHTML=''; };
  el('calNext').onclick = ()=>{ mes++; if(mes==13){mes=1;ano++;} sel={tipo:'mes'}; renderCal(); el('calDet').innerHTML=''; };
  renderCal();
}

function renderCompEstoque(box){
  const est = COMP.estoque;
  const neg = est.filter(e=>e.atual<0);
  box.innerHTML = kpis([
    {l:'Produtos', v:est.length, d:'', cls:''},
    {l:'Estoque negativo', v:neg.length, d:neg.length?'verificar no ERP':'ok', cls:neg.length?'down':'up'},
  ]) + '<div class="card" style="margin-top:14px"><h2>Posição de estoque — ovos para industrialização</h2>'+
   tabela(est,[{t:'Cód',f:r=>r.cod},{t:'Produto',f:r=>r.desc},{t:'Granja',f:r=>r.fab},
    {t:'Final',num:1,f:r=>fmt(r.fin)},{t:'Atual',num:1,f:r=>`<span style="color:${r.atual<0?'var(--bad)':'inherit'}">${fmt(r.atual)}</span>`}])+'</div>';
}
