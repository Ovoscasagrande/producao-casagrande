*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:20px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:19px;font-weight:700}
h2{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.head .sub{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.15s}.tabs button:hover{border-color:var(--acc);color:var(--txt)}
.tabs button:hover{color:var(--txt)}
.tabs button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.page{display:none}.page.on{display:block}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px}
.kpi .d{font-size:11px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}.mut{color:var(--mut)}
.row2{grid-template-columns:2fr 1fr}.row3{grid-template-columns:1fr 1fr}
@media(max-width:900px){.row2,.row3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chartbox{position:relative;height:280px}.chartbox.tall{height:340px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid rgba(38,49,74,.5)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.bar{height:6px;border-radius:3px;background:var(--acc);min-width:2px}
.foot{color:var(--mut);font-size:11px;margin-top:14px;text-align:center}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.b{background:rgba(255,255,255,.12);color:#fff}.pill.v{background:rgba(255,212,0,.15);color:var(--acc)}
.note{color:var(--mut);font-size:12px;margin-top:10px}
</style>

const dia = D.dia, serie = D.serie;

const PAGES = [

 {id:'ano',    nome:'📈 Ano'},

];
el('tabs').innerHTML = PAGES.map((p,i)=>`<button data-p="${p.id}" class="${i==0?'on':''}">${p.nome}</button>`).join('');
el('tabs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  el('pg-'+b.dataset.p).classList.add('on');
  window.scrollTo({top:0});
};
el('pages').innerHTML = PAGES.map(p=>`<div class="page ${p.id=='hoje'?'on':''}" id="pg-${p.id}"></div>`).join('');

/* ---------- helpers ---------- */
function kpis(list){
  return '<div class="grid kpis">'+list.map(k=>
    `<div class="kpi"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="d ${k.cls||''}">${k.d||''}</div></div>`).join('')+'</div>';
}
function card(t, inner){ return `<div class="card"><h2>${t}</h2>${inner}</div>`; }
function chart(id, h){ return `<div class="chartbox ${h||''}"><canvas id="${id}"></canvas></div>`; }
function tabela(rows, cols){ /* cols: [{t, c}] */
  return '<table><tr>'+cols.map(c=>`<th class="${c.num?'num':''}">${c.t}</th>`).join('')+'</tr>'+
    rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.num?'num':''}">${c.f(r)}</td>`).join('')+'</tr>').join('')+'</table>';
}

   kpis([
    {l:'Dias na meta (últ. 60)', v:diasOk+' / '+ult.length, d:(diasOk/ult.length*100).toFixed(0)+'% de aproveitamento', cls:diasOk/ult.length>=.7?'up':'down'},
    {l:'Média realizada', v:fmt(mediaUlt)+' cx', d:'meta média: '+fmt(mediaMeta)+' cx', cls:mediaUlt>=mediaMeta?'up':'down'},
    {l:'Ontem vs meta', v:fmt(dia.total)+' / '+fmt(metaDe(dia.data)), d:dia.total>=metaDe(dia.data)?'✔ meta batida':'✖ abaixo da meta', cls:dia.total>=metaDe(dia.data)?'up':'down'},
   ]) +
   '<div class="card" style="margin-top:14px"><h2>Produção × meta — últimos 60 dias</h2>'+chart('cMeta','tall')+'</div>' +
   '<div class="note">Meta padrão: '+fmt(padrao)+' caixas/dia. Para ajustar (por dia da semana também), me peça — fica em work/producao/meta.json.</div>';
  new Chart(el('cMeta'),{type:'line',data:{labels:ult.map(d=>d.data.slice(8,10)+'/'+d.data.slice(5,7)),
   datasets:[
    {label:'Produção',data:ult.map(d=>d.total),borderColor:'#f5a623',backgroundColor:'rgba(245,166,35,.12)',fill:true,tension:.3,pointRadius:2},
    {label:'Meta',data:ult.map(d=>metaDe(d.data)),borderColor:'#ffffff',borderDash:[6,4],pointRadius:0,fill:false}
   ]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12}}},scales:{y:{beginAtZero:true}}}});
})();

/* ================= ABA MIX ================= */
(function(){
  const ms = D.mix_series;
  const aps = [...new Set(ms.flatMap(m=>Object.keys(m.apres)))];
  const cores = ['#ffd400','#ffffff','#a3a3a3','#f5c518','#d4d4d4','#eab308','#737373','#fde047','#525252','#fef08a'];
  el('pg-mix').innerHTML =
   kpis([
    {l:'Apresentações ativas', v:aps.length, d:'', cls:''},
    {l:'Mês de referência', v:fmt(mesTot)+' cx', d:dia.data.slice(0,7), cls:''},
   ]) +
   '<div class="card" style="margin-top:14px"><h2>Mix por apresentação — mês a mês (caixas, empilhado)</h2>'+chart('cMix','tall')+'</div>' +
   '<div class="grid row2" style="margin-top:14px">' +
     card('Mix do mês de referência', chart('cMixMes')) +
     card('Mix do ano', chart('cMixAno')) +
   '</div>';
  new Chart(el('cMix'),{type:'line',data:{labels:ms.map(m=>MESN[+m.mes.slice(5,7)-1]),
   datasets:aps.map((a,i)=>({label:a,data:ms.map(m=>m.apres[a]||0),backgroundColor:cores[i%cores.length]+'cc',borderColor:cores[i%cores.length],fill:true,stack:'s',tension:.3,pointRadius:0}))},
   options:{maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,font:{size:10}}}},scales:{y:{stacked:true,beginAtZero:true},x:{stacked:true}}}});
  const mm = D.por_apres_mes, ma = D.por_apres_anual;
  const sortM = Object.entries(mm).sort((a,b)=>b[1]-a[1]);
  const sortA = Object.entries(ma).sort((a,b)=>b[1]-a[1]);
  new Chart(el('cMixMes'),{type:'doughnut',data:{labels:sortM.map(x=>x[0]),datasets:[{data:sortM.map(x=>x[1]),backgroundColor:cores,borderWidth:0}]},
   options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:10}}}}}});
  new Chart(el('cMixAno'),{type:'doughnut',data:{labels:sortA.map(x=>x[0]),datasets:[{data:sortA.map(x=>x[1]),backgroundColor:cores,borderWidth:0}]},
   options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:10}}}}}});
})();

/* ================= ABA ANO ================= */
(function(){
  const meses = Object.keys(D.por_mes).sort();
  const vals = meses.map(m=>D.por_mes[m]);
  const bestM = meses[vals.indexOf(Math.max(...vals))];
  const totalAno = vals.reduce((a,b)=>a+b,0);
  el('pg-ano').innerHTML =
   kpis([
    {l:'Total no ano', v:fmt(totalAno)+' cx', d:meses.length+' meses com produção', cls:''},
    {l:'Melhor mês', v:fmt(Math.max(...vals))+' cx', d:MESN[+bestM.slice(5,7)-1], cls:'up'},
    {l:'Média mensal', v:fmt(totalAno/meses.length)+' cx', d:'', cls:'mut'},
   ]) +
   '<div class="card" style="margin-top:14px"><h2>Produção por mês — 2026</h2>'+chart('cAnoMes','tall')+'</div>' +
   '<div class="grid row2" style="margin-top:14px">' +
     card('Produção por semana do ano', chart('cAnoSem','tall')) +
     card('Média por dia da semana', chart('cAnoDow','tall')) +
   '</div>' +
   '<div class="note">Comparativo com 2025: ainda não há base de 2025 na planilha — a partir de 2027 o comparativo ano a ano sai automaticamente.</div>';
  // semanas
  const sem = {};
  for(const d of serie){
    const dt = new Date(d.data+'T12:00:00');
    const w = Math.ceil((((dt - new Date(dt.getFullYear(),0,1))/86400000)+1)/7);
    sem[w]=(sem[w]||0)+d.total;
  }
  const sw = Object.keys(sem).sort((a,b)=>a-b);
  new Chart(el('cAnoMes'),{type:'bar',data:{labels:meses.map(m=>MESN[+m.slice(5,7)-1]),datasets:[{data:vals,backgroundColor:'#ffffff',borderRadius:6}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
  new Chart(el('cAnoSem'),{type:'line',data:{labels:sw,datasets:[{data:sw.map(w=>sem[w]),borderColor:'#3b82f6',backgroundColor:'rgba(255,255,255,.10)',fill:true,tension:.3,pointRadius:2}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
  const dw2 = ordem.filter(w=>D.med_dow[w]!==undefined).map(w=>[w,D.med_dow[w]]);
  new Chart(el('cAnoDow'),{type:'bar',data:{labels:dw2.map(x=>x[0]),datasets:[{data:dw2.map(x=>x[1]),backgroundColor:'#ffd400',borderRadius:6}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
})();

/* ================= ABA BANDEJAS ================= */
(function(){
  const bj = D.bandejas||{};
  const datas = Object.keys(bj).sort();
  if(!datas.length){
    el('pg-bandejas').innerHTML =
     '<div class="card"><h2>Consumo de bandejas (HORA COLABORADOR)</h2><p class="note" style="font-size:13px">A base histórica da planilha não tem as linhas "HORA COLABORADOR" — esse controle começa agora.<br><br>Todo dia, quando você colar a produção do ERP, as linhas <b>HORA COLABORADOR POR BANDEJA</b> são registradas automaticamente e esta aba se monta sozinha: consumo por tamanho (c/6, c/12, c/20, c/30) e evolução diária.<br><br><b>Ponto de partida:</b> 03/11/2026 — bandejas em estoque: c/6: 46.953 · c/12: 495.173 · c/20: −87.303 · c/30: 184.212.</p></div>';
    return;
  }
  const tams = [...new Set(datas.flatMap(d=>Object.keys(bj[d])))].sort((a,b)=>+a-+b);
  el('pg-bandejas').innerHTML =
   kpis(tams.map(t=>{
     const u = bj[datas[datas.length-1]][t];
     return {l:'Estoque bandeja c/'+t, v:fmt(u.fin), d:'saída ontem: '+fmt(u.sai), cls:u.fin<0?'down':''};
   })) +
   '<div class="card" style="margin-top:14px"><h2>Consumo diário de bandejas por tamanho</h2>'+chart('cBj','tall')+'</div>';
  new Chart(el('cBj'),{type:'bar',data:{labels:datas.map(d=>d.slice(8,10)+'/'+d.slice(5,7)),
   datasets:tams.map((t,i)=>({label:'c/'+t,data:datas.map(d=>bj[d][t]?bj[d][t].sai:0),backgroundColor:cores[i%cores.length],borderRadius:4}))},
   options:{maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12}}},scales:{y:{beginAtZero:true}}}});
})();

/* ================= ABA GIRO ================= */
(function(){
  const giro = D.giro_med;
  const est = D.estoque_caixas;
  // dias de cobertura = estoque final / giro médio diário
  const rows = est.map(e=>{
    const g = giro[e.apres||''] || null;
    return e;
  });
  // casar estoque (por desc) com giro (por apresentação), agregando códigos duplicados
  const agg = {};
  est.forEach(e=>{
    const dU = e.desc.toUpperCase();
    const n = parseInt(dU); const cat = dU.includes('BRANCO')?'BRANCO':'VERMELHO';
    const linha = dU.includes('GRANDE')?'GRANDE':(dU.includes('EXTRA')?'EXTRA':(dU.includes('MEDIO')||dU.includes('MÉDIO'))?'MÉDIO':'JUMBO');
    const ap = n+' OVOS '+linha+' '+cat;
    const a = agg[ap] = agg[ap] || {ap, fin:0, cods:[]};
    a.fin += e.fin; a.cods.push(e.cod);
  });
  const rows2 = Object.values(agg).map(a=>{
    const g = giro[a.ap]||0;
    const cob = g>0 ? a.fin/g : null;
    return {...a, giro:g, cob};
  }).sort((a,b)=>(a.cob??1e9)-(b.cob??1e9));
  el('pg-giro').innerHTML =
   '<div class="card"><h2>Dias de cobertura por produto (estoque final ÷ giro médio/dia dos últimos 30 dias)</h2>'+
   tabela(rows2, [
     {t:'Códigos',f:r=>r.cods.join(', ')},
     {t:'Produto',f:r=>`<span class="pill ${r.ap.includes('BRANCO')?'b':'v'}">${r.ap}</span>`},
     {t:'Estoque (bandejas)',num:1,f:r=>fmt(r.fin)},
     {t:'Giro médio/dia (caixas)',num:1,f:r=>fmt(r.giro)},
     {t:'Cobertura (dias)',num:1,f:r=>r.cob==null?'—':(r.cob>999?'∞':fmt(r.cob))},
   ]) + '</div>' +
   '<div class="note">Cobertura alta = produto parado em estoque; baixa (=0 ou ∞) = produto sem giro ou sem produção no período. Base: últimos 30 dias produzidos.</div>';
})();
</script>
