<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel OVOS CASAGRANDE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#141414;--txt:#fff;--mut:#9a9a9a;--acc:#ffd400;--ok:#4ade80;--bad:#ff5c5c;--line:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px}

/* ===== sidebar ===== */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:64px;background:#000;border-right:1px solid var(--line);
 z-index:100;overflow:hidden;transition:width .25s ease;display:flex;flex-direction:column}
#sidebar:hover{width:220px}
#sidebar .logo-mini{height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);flex-shrink:0}
#sidebar .logo-mini img{height:44px;width:auto;transition:.25s}
#sidebar:hover .logo-mini img{height:40px}
#sidebar nav{padding:12px 0;flex:1}
#sidebar .item{display:flex;align-items:center;gap:14px;padding:14px 20px;color:var(--mut);cursor:pointer;white-space:nowrap;text-decoration:none}
#sidebar .item .ico{font-size:20px;width:24px;text-align:center;flex-shrink:0}
#sidebar .item .lbl{font-size:14px;opacity:0;transition:.2s}
#sidebar:hover .item .lbl{opacity:1}
#sidebar .item:hover{color:var(--txt);background:#141414}
#sidebar .item.on{color:var(--acc);border-left:3px solid var(--acc);padding-left:17px}
#sidebar .foot{padding:14px 20px;color:#555;font-size:11px;white-space:nowrap;opacity:0;transition:.2s}
#sidebar:hover .foot{opacity:1}
.main{margin-left:64px;transition:margin .25s ease}
#sidebar:hover ~ .main{margin-left:220px}

/* ===== home ===== */
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
#home img{height:300px;width:auto}
#home h1{font-size:34px;letter-spacing:.14em;font-weight:800}
#home .sub{color:var(--mut);font-size:13px;letter-spacing:.08em}
#home .btns{display:flex;gap:16px;margin-top:10px}
#home .btns button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;
 padding:16px 34px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
#home .btns button:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}
h1{font-size:19px;font-weight:700}
h2{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.head .sub{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs .dept{background:var(--acc);color:#000;border:none;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer}
.tabs .sub{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer}
.tabs .sub.on{background:#2a2a2a;color:var(--acc);border-color:var(--acc)}
.tabs .sub:hover{color:var(--txt)}
.dept-page{display:none}.dept-page.on{display:block}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px}
.kpi .d{font-size:11px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}.mut{color:var(--mut)}
.row2{grid-template-columns:2fr 1fr}.row3{grid-template-columns:1fr 1fr}
@media(max-width:900px){.row2,.row3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chartbox{position:relative;height:280px}.chartbox.tall{height:340px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid rgba(42,42,42,.6)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.bar{height:6px;border-radius:3px;background:var(--acc);min-width:2px}
.foot{color:var(--mut);font-size:11px;margin-top:14px;text-align:center}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.b{background:rgba(255,255,255,.12);color:#fff}.pill.v{background:rgba(255,212,0,.15);color:var(--acc)}
.note{color:var(--mut);font-size:12px;margin-top:10px}
</style>
</head>

  document.querySelectorAll('.subpage').forEach(p=>p.style.display='none');
  el('sp-'+sid).style.display='block';
  window.scrollTo({top:0});
}
el('nav').onclick = e => { const i = e.target.closest('.item'); if(!i) return;
  if(i.dataset.home) goHome(); else openDept(i.dataset.d); };
el('homeBtns').onclick = e => { const b = e.target.closest('button'); if(b) openDept(b.dataset.d); };
el('tabs').onclick = e => { const b = e.target.closest('button'); if(b) show(DEPTS.find(d=>el('dp-'+d.id).classList.contains('on')).id, b.dataset.s); };

// renderizar tudo de uma vez (charts em páginas ocultas funcionam com maintainAspectRatio:false)
DEPTS.forEach(d=>d.subs.forEach(s=>{ try{ s.render(el('sp-'+s.id)); }catch(e){ el('sp-'+s.id).innerHTML='<div class="card note">Erro: '+e.message+'</div>'; } }));
goHome();

/* ===== helpers ===== */
function kpis(list){ return '<div class="grid kpis">'+list.map(k=>
  `<div class="kpi"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="d ${k.cls||''}">${k.d||''}</div></div>`).join('')+'</div>'; }
function card(t, inner){ return `<div class="card"><h2>${t}</h2>${inner}</div>`; }
function chart(id, h){ return `<div class="chartbox ${h||''}"><canvas id="${id}"></canvas></div>`; }
function tabela(rows, cols){ return '<table><tr>'+cols.map(c=>`<th class="${c.num?'num':''}">${c.t}</th>`).join('')+'</tr>'+
  rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.num?'num':''}">${c.f(r)}</td>`).join('')+'</tr>').join('')+'</table>'; }
function line(id, labels, data, color, fill){ return new Chart(el(id),{type:'line',data:{labels,datasets:[{data,borderColor:color,backgroundColor:fill,tension:.3,pointRadius:2,fill:!!fill}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}); }
function bar(id, labels, data, color){ return new Chart(el(id),{type:'bar',data:{labels,datasets:[{data,backgroundColor:color,borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}); }

/* ================= PRODUÇÃO ================= */
function renderProdHoje(box){
  const dia = PROD.dia, serie = PROD.serie;
  const prev = serie.length>1?serie[serie.length-2]:null;
  const media = serie.reduce((s,x)=>s+x.total,0)/serie.length;
  const diff = prev?dia.total-prev.total:0;
  const pct = prev&&prev.total?diff/prev.total*100:0;
  const best = serie.reduce((a,b)=>b.total>a.total?b:a,serie[0]);
  const mesTot = Object.values(PROD.por_apres_mes).reduce((a,b)=>a+b,0);
  box.innerHTML = kpis([
    {l:'Produção do dia ('+dia.data+')', v:fmt(dia.total)+' cx', d:prev?(diff>=0?'▲ +':'▼ ')+fmt(diff)+' cx ('+pct.toFixed(1)+'%)':'', cls:diff>=0?'up':'down'},
    {l:'Média/dia (ano)', v:fmt(media)+' cx', d:serie.length+' dias produzidos', cls:'mut'},
    {l:'Total no mês', v:fmt(mesTot)+' cx', d:'', cls:''},
    {l:'Melhor dia do ano', v:fmt(best.total)+' cx', d:best.data, cls:''},
  ]) + '<div class="grid row2" style="margin-top:14px">'+
    card('Produção diária — últimos 60 dias (caixas)', chart('pSerie','tall'))+
    card('Média por dia da semana', chart('pDow','tall'))+
  '</div><div class="grid row3" style="margin-top:14px">'+
    card('Produção por mês — 2026', chart('pMes'))+
    card('Mix por tipo de ovo — ano', chart('pTipo'))+
  '</div><div class="grid row2" style="margin-top:14px">'+
    card('Produção do dia por apresentação', tabela(Object.entries(dia.apres).sort((a,b)=>b[1]-a[1]),
      [{t:'Apresentação',f:r=>`<span class="pill ${r[0].includes('BRANCO')?'b':'v'}">${r[0]}</span>`},{t:'Caixas',num:1,f:r=>fmt(r[1])},
       {t:'',f:r=>{const mx=Math.max(...Object.values(dia.apres));return `<div class="bar" style="width:${(r[1]/mx*100).toFixed(1)}%"></div>`}}]))+
    card('Posição de estoque (ERP)', tabela(PROD.estoque,
      [{t:'Cód',f:r=>r.cod},{t:'Produto',f:r=>r.desc.replace(' - OVOS CASAGRANDE','')},
       {t:'Final',num:1,f:r=>fmt(r.final)},{t:'Atual',num:1,f:r=>`<span style="color:${r.atual<0?'var(--bad)':'inherit'}">${fmt(r.atual)}</span>`}]))+
  '</div>';
  line('pSerie', PROD.ult60.map(d=>d.data.slice(8,10)+'/'+d.data.slice(5,7)), PROD.ult60.map(d=>d.total), '#ffd400','rgba(255,212,0,.14)');
  const dw = DIAS.filter(w=>PROD.med_dow[w]!==undefined).map(w=>[w,PROD.med_dow[w]]);
  bar('pDow', dw.map(x=>x[0]), dw.map(x=>x[1]), '#ffd400');
  const meses = Object.keys(PROD.por_mes).sort();
  bar('pMes', meses.map(m=>MESN[+m.slice(5,7)-1]), meses.map(m=>PROD.por_mes[m]), '#fff');
  const tipo={}; for(const [a,v] of Object.entries(PROD.por_apres_anual)){const c=a.includes('BRANCO')?'BRANCO':'VERMELHO';tipo[c]=(tipo[c]||0)+v;}
  new Chart(el('pTipo'),{type:'doughnut',data:{labels:Object.keys(tipo),datasets:[{data:Object.values(tipo),backgroundColor:['#fff','#ffd400'],borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
}

function renderProdMeta(box){
  const m = PROD.meta||{padrao:1200}; const padrao = m.padrao||1200;
  const metaDe = d => (m.por_dow&&m.por_dow[DIAS[new Date(d+'T12:00:00').getDay()]])||padrao;
  const ult = PROD.ult60;
  const ok = ult.filter(d=>d.total>=metaDe(d.data)).length;
  const mediaUlt = ult.reduce((s,x)=>s+x.total,0)/ult.length;
  box.innerHTML = kpis([
    {l:'Dias na meta (últ. 60)', v:ok+' / '+ult.length, d:(ok/ult.length*100).toFixed(0)+'% de aproveitamento', cls:ok/ult.length>=.7?'up':'down'},
    {l:'Média realizada', v:fmt(mediaUlt)+' cx', d:'meta: '+fmt(padrao)+' cx', cls:mediaUlt>=padrao?'up':'down'},
    {l:'Ontem vs meta', v:fmt(Math.round(PROD.dia.total))+' / '+fmt(metaDe(PROD.dia.data)), d:Math.round(PROD.dia.total)>=metaDe(PROD.dia.data)?'✔ meta batida':'✖ abaixo', cls:Math.round(PROD.dia.total)>=metaDe(PROD.dia.data)?'up':'down'},
  ]) + '<div class="card" style="margin-top:14px"><h2>Produção × meta — últimos 60 dias</h2>'+chart('pMeta','tall')+'</div>';
  new Chart(el('pMeta'),{type:'line',data:{labels:ult.map(d=>d.data.slice(8,10)+'/'+d.data.slice(5,7)),datasets:[
    {label:'Produção',data:ult.map(d=>d.total),borderColor:'#ffd400',backgroundColor:'rgba(255,212,0,.12)',fill:true,tension:.3,pointRadius:2},
    {label:'Meta',data:ult.map(d=>metaDe(d.data)),borderColor:'#fff',borderDash:[6,4],pointRadius:0}]},
   options:{maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12}}},scales:{y:{beginAtZero:true}}}});
}

function renderProdMix(box){
  const ms = PROD.mix_series;
  const aps = [...new Set(ms.flatMap(m=>Object.keys(m.apres)))];
  const cores = ['#ffd400','#ffffff','#a3a3a3','#f5c518','#d4d4d4','#eab308','#737373','#fde047','#525252','#fef08a'];
  box.innerHTML = kpis([{l:'Apresentações ativas', v:aps.length, d:'', cls:''}]) +
   '<div class="card" style="margin-top:14px"><h2>Mix por apresentação — mês a mês (empilhado)</h2>'+chart('pMix','tall')+'</div>'+
   '<div class="grid row3" style="margin-top:14px">'+
    card('Mix do mês', chart('pMixMes'))+card('Mix do ano', chart('pMixAno'))+'</div>';
  new Chart(el('pMix'),{type:'line',data:{labels:ms.map(m=>MESN[+m.mes.slice(5,7)-1]),
   datasets:aps.map((a,i)=>({label:a,data:ms.map(m=>m.apres[a]||0),backgroundColor:cores[i%cores.length]+'cc',borderColor:cores[i%cores.length],fill:true,stack:'s',tension:.3,pointRadius:0}))},
   options:{maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,font:{size:10}}}},scales:{y:{stacked:true,beginAtZero:true},x:{stacked:true}}}});
  const sM = Object.entries(PROD.por_apres_mes).sort((a,b)=>b[1]-a[1]);
  const sA = Object.entries(PROD.por_apres_anual).sort((a,b)=>b[1]-a[1]);
  new Chart(el('pMixMes'),{type:'doughnut',data:{labels:sM.map(x=>x[0]),datasets:[{data:sM.map(x=>x[1]),backgroundColor:cores,borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:10}}}}}});
  new Chart(el('pMixAno'),{type:'doughnut',data:{labels:sA.map(x=>x[0]),datasets:[{data:sA.map(x=>x[1]),backgroundColor:cores,borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:10}}}}}});
}

function renderProdAno(box){
  const meses = Object.keys(PROD.por_mes).sort();
  const vals = meses.map(m=>PROD.por_mes[m]);
  const bestM = meses[vals.indexOf(Math.max(...vals))];
  box.innerHTML = kpis([
    {l:'Total no ano', v:fmt(vals.reduce((a,b)=>a+b,0))+' cx', d:meses.length+' meses', cls:''},
    {l:'Melhor mês', v:fmt(Math.max(...vals))+' cx', d:MESN[+bestM.slice(5,7)-1], cls:'up'},
  ]) + '<div class="card" style="margin-top:14px"><h2>Produção por mês — 2026</h2>'+chart('pAnoMes','tall')+'</div>'+
   '<div class="grid row2" style="margin-top:14px">'+card('Produção por semana do ano', chart('pAnoSem','tall'))+card('Média por dia da semana', chart('pAnoDow','tall'))+'</div>';
  const sem={}; for(const d of PROD.serie){const dt=new Date(d.data+'T12:00:00');const w=Math.ceil((((dt-new Date(dt.getFullYear(),0,1))/86400000)+1)/7);sem[w]=(sem[w]||0)+d.total;}
  const sw=Object.keys(sem).sort((a,b)=>a-b);
  bar('pAnoMes', meses.map(m=>MESN[+m.slice(5,7)-1]), vals, '#fff');
  line('pAnoSem', sw, sw.map(w=>sem[w]), '#ffd400','rgba(255,212,0,.12)');
  const dw2 = DIAS.filter(w=>PROD.med_dow[w]!==undefined).map(w=>[w,PROD.med_dow[w]]);
  bar('pAnoDow', dw2.map(x=>x[0]), dw2.map(x=>x[1]), '#ffd400');
}

function renderProdBandejas(box){
  const bj = PROD.bandejas||{}; const datas = Object.keys(bj).sort();
  if(!datas.length){ box.innerHTML = '<div class="card"><h2>Consumo de bandejas</h2><p class="note">Começa a acumular com os pastes diários (linhas HORA COLABORADOR do ERP).</p></div>'; return; }
  const tams = [...new Set(datas.flatMap(d=>Object.keys(bj[d])))].sort((a,b)=>+a-+b);
  const cores = ['#ffd400','#ffffff','#a3a3a3','#f5c518'];
  box.innerHTML = kpis(tams.map(t=>{const u=bj[datas[datas.length-1]][t];return {l:'Estoque bandeja c/'+t, v:fmt(u.fin), d:'saída ontem: '+fmt(u.sai), cls:u.fin<0?'down':''};})) +
   '<div class="card" style="margin-top:14px"><h2>Consumo diário de bandejas por tamanho</h2>'+chart('pBj','tall')+'</div>';
  new Chart(el('pBj'),{type:'bar',data:{labels:datas.map(d=>d.slice(8,10)+'/'+d.slice(5,7)),
   datasets:tams.map((t,i)=>({label:'c/'+t,data:datas.map(d=>bj[d][t]?bj[d][t].sai:0),backgroundColor:cores[i%cores.length],borderRadius:4}))},
   options:{maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12}}},scales:{y:{beginAtZero:true}}}});
}

function renderProdGiro(box){
  const giro = PROD.giro_med, est = PROD.estoque_caixas;
  const agg = {};
  est.forEach(e=>{ const dU=e.desc.toUpperCase(); const n=parseInt(dU);
    const cat=dU.includes('BRANCO')?'BRANCO':'VERMELHO';
    const lin=dU.includes('GRANDE')?'GRANDE':(dU.includes('EXTRA')?'EXTRA':(dU.includes('MEDIO')||dU.includes('MÉDIO'))?'MÉDIO':'JUMBO');
    const ap=n+' OVOS '+lin+' '+cat;
    const a=agg[ap]=agg[ap]||{ap,fin:0,cods:[]}; a.fin+=e.fin; a.cods.push(e.cod); });
  const rows = Object.values(agg).map(a=>{const g=giro[a.ap]||0;return {...a,giro:g,cob:g>0?a.fin/g:null};}).sort((a,b)=>(a.cob??1e9)-(b.cob??1e9));
  box.innerHTML = '<div class="card"><h2>Dias de cobertura por produto (estoque ÷ giro médio/dia, últ. 30 dias)</h2>'+
   tabela(rows,[{t:'Códigos',f:r=>r.cods.join(', ')},{t:'Produto',f:r=>`<span class="pill ${r.ap.includes('BRANCO')?'b':'v'}">${r.ap}</span>`},
    {t:'Estoque',num:1,f:r=>fmt(r.fin)},{t:'Giro/dia',num:1,f:r=>fmt(r.giro)},{t:'Cobertura (dias)',num:1,f:r=>r.cob==null?'—':(r.cob>999?'∞':fmt(r.cob))}])+'</div>';
}

/* ================= COMPRAS ================= */
function renderCompHoje(box){
  const dia = COMP.dia, serie = COMP.serie;
  const prev = serie.length>1?serie[serie.length-2]:null;
  const diff = prev?dia.total-prev.total:null;
  const media = serie.reduce((s,x)=>s+x.total,0)/serie.length;
  box.innerHTML = kpis([
    {l:'Compras do dia ('+dia.data+')', v:fmt(dia.total)+' cx', d:diff!=null?(diff>=0?'▲ +':'▼ ')+fmt(diff)+' cx vs dia anterior':'', cls:diff==null?'':(diff>=0?'up':'down')},
    {l:'Média/dia (histórico)', v:fmt(media)+' cx', d:serie.length+' dias com compra', cls:'mut'},
    {l:'Itens comprados', v:dia.items.filter(i=>i.caixa>0).length, d:'de '+dia.items.length+' produtos', cls:''},
  ]) + '<div class="grid row2" style="margin-top:14px">'+
    card('Compras diárias — últimos 60 dias (caixas)', chart('cSerie','tall'))+
    card('Média por dia da semana', chart('cDow','tall'))+
  '</div><div class="card" style="margin-top:14px">'+
    card('Compras do dia por produto', tabela(dia.items.filter(i=>i.caixa>0||i.compra<0),
      [{t:'Cód',f:r=>r.cod},{t:'Produto',f:r=>r.desc},{t:'Granja',f:r=>r.fab},
       {t:'Unidades',num:1,f:r=>fmt(r.compra)},{t:'Caixas',num:1,f:r=>fmt(r.caixa)},
       {t:'Estoque final',num:1,f:r=>`<span style="color:${r.fin<=0?'var(--bad)':'inherit'}">${fmt(r.fin)}</span>`}]))+
  '</div>';
  line('cSerie', COMP.ult60.map(d=>d.data.slice(8,10)+'/'+d.data.slice(5,7)), COMP.ult60.map(d=>d.total), '#ffd400','rgba(255,212,0,.14)');
  const dw = DIAS.filter(w=>COMP.med_dow[w]!==undefined).map(w=>[w,COMP.med_dow[w]]);
  bar('cDow', dw.map(x=>x[0]), dw.map(x=>x[1]), '#ffd400');
}

function renderCompFab(box){
  const pf = Object.entries(COMP.por_fab_mes).sort((a,b)=>b[1]-a[1]);
  const total = pf.reduce((s,x)=>s+x[1],0);
  box.innerHTML = kpis([{l:'Granjas ativas no mês', v:pf.length, d:'', cls:''},{l:'Total comprado no mês', v:fmt(total)+' cx', d:COMP.ref.slice(0,7), cls:''}]) +
   '<div class="grid row2" style="margin-top:14px">'+
    card('Participação por granja — mês', chart('cFabPie'))+
    card('Compras por granja — mês (caixas)', chart('cFabBar','tall'))+
  '</div><div class="card" style="margin-top:14px"><h2>Detalhamento por granja</h2>'+
   tabela(pf,[{t:'Granja',f:r=>r[0]},{t:'Caixas',num:1,f:r=>fmt(r[1])},
    {t:'% do total',num:1,f:r=>(r[1]/total*100).toFixed(1)+'%'},
    {t:'',f:r=>{const mx=pf[0][1];return `<div class="bar" style="width:${(r[1]/mx*100).toFixed(1)}%"></div>`}}])+'</div>';
  new Chart(el('cFabPie'),{type:'doughnut',data:{labels:pf.slice(0,8).map(x=>x[0]),datasets:[{data:pf.slice(0,8).map(x=>x[1]),backgroundColor:['#ffd400','#fff','#a3a3a3','#f5c518','#d4d4d4','#eab308','#737373','#fde047'],borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:10}}}}}});
  bar('cFabBar', pf.map(x=>x[0]), pf.map(x=>x[1]), '#ffd400');
}

function renderCompMix(box){
  const pc = Object.entries(COMP.por_cat_mes).sort((a,b)=>b[1]-a[1]);
  const pl = Object.entries(COMP.por_lin_mes).sort((a,b)=>b[1]-a[1]);
  const tp = COMP.top_prod_mes;
  box.innerHTML = '<div class="grid row3">'+
    card('Por categoria — mês', chart('cCat'))+card('Por linha — mês', chart('cLin'))+
    card('Top produtos — mês', tabela(tp,[{t:'Cód',f:r=>r.cod},{t:'Produto',f:r=>r.desc.length>28?r.desc.slice(0,28)+'…':r.desc},{t:'Caixas',num:1,f:r=>fmt(r.caixa)}]))+
  '</div><div class="card" style="margin-top:14px"><h2>Compras por linha — detalhe</h2>'+
   tabela(pl,[{t:'Linha',f:r=>r[0]},{t:'Caixas',num:1,f:r=>fmt(r[1])}])+'</div>';
  new Chart(el('cCat'),{type:'doughnut',data:{labels:pc.map(x=>x[0]),datasets:[{data:pc.map(x=>x[1]),backgroundColor:['#ffd400','#fff','#a3a3a3','#f5c518'],borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
  new Chart(el('cLin'),{type:'doughnut',data:{labels:pl.map(x=>x[0]),datasets:[{data:pl.map(x=>x[1]),backgroundColor:['#ffd400','#fff','#a3a3a3','#f5c518','#d4d4d4','#eab308'],borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
}

function renderCompHist(box){
  const meses = Object.keys(COMP.por_mes).sort();
  const vals = meses.map(m=>COMP.por_mes[m]);
  box.innerHTML = kpis([
    {l:'Total no histórico', v:fmt(vals.reduce((a,b)=>a+b,0))+' cx', d:meses.length+' meses', cls:''},
    {l:'Melhor mês', v:fmt(Math.max(...vals))+' cx', d:MESN[+meses[vals.indexOf(Math.max(...vals))].slice(5,7)-1], cls:'up'},
  ]) + '<div class="card" style="margin-top:14px"><h2>Compras por mês (2025 → 2026)</h2>'+chart('cMes','tall')+'</div>';
  bar('cMes', meses.map(m=>m.slice(5,7)+'/'+m.slice(2,4)), vals, '#ffd400');
}

function renderCompEstoque(box){
  const est = COMP.estoque;
  const neg = est.filter(e=>e.atual<0);
  box.innerHTML = kpis([
    {l:'Produtos', v:est.length, d:'', cls:''},
    {l:'Estoque negativo', v:neg.length, d:neg.length?'verificar no ERP':'ok', cls:neg.length?'down':'up'},
  ]) + '<div class="card" style="margin-top:14px"><h2>Posição de estoque — ovos para industrialização</h2>'+
   tabela(est,[{t:'Cód',f:r=>r.cod},{t:'Produto',f:r=>r.desc},{t:'Granja',f:r=>r.fab},
    {t:'Final',num:1,f:r=>fmt(r.fin)},{t:'Atual',num:1,f:r=>`<span style="color:${r.atual<0?'var(--bad)':'inherit'}">${fmt(r.atual)}</span>`}])+'</div>';
}
