<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel OVOS — Análises | Ovos Casagrande</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --line:#e2e8f0;
  --txt:#0f172a;
  --mut:#64748b;
  --acc:#f59e0b;
  --acc-bright:#ffd400;
  --acc-soft:#fef9c3;
  --bad:#dc2626;
  --bad-bg:#fef2f2;
  --ok:#16a34a;
  --ok-bg:#f0fdf4;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.05);
  --shadow-md:0 10px 25px -5px rgba(15,23,42,.07),0 4px 10px -3px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Login Screen ---------- */
#loginScreen{
  position:fixed;inset:0;
  background:radial-gradient(circle at top right,#fef9c3 0%,#f4f6f9 45%,#eef2f6 100%);
  display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:600;
}
.loginbox{
  background:var(--card);
  border:1px solid var(--line);
  border-top:4px solid var(--acc-bright);
  border-radius:20px;
  padding:36px 32px 30px;
  width:min(94vw,400px);
  text-align:center;
  box-shadow:var(--shadow-md);
}
.loginbox .brand-wrap{display:flex;justify-content:center;margin-bottom:16px}
.loginbox svg{height:64px;width:auto}
.loginbox h3{color:var(--txt);margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.loginbox .sub{color:var(--mut);font-size:13px;margin-bottom:22px}
.loginbox .field{text-align:left;margin-bottom:12px}
.loginbox .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:5px}
.loginbox input{
  width:100%;background:#f8fafc;color:var(--txt);
  border:1px solid #cbd5e1;border-radius:12px;
  padding:12px 14px;font-size:14px;outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.loginbox input:focus{
  background:#fff;border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(245,158,11,.18);
}
.loginbox .err{color:var(--bad);font-size:12px;font-weight:600;margin-top:10px;min-height:18px}
.loginbox button{
  width:100%;padding:13px;border-radius:12px;border:none;
  background:linear-gradient(135deg,#ffd400 0%,#f59e0b 100%);
  color:#0f172a;font-weight:800;font-size:14px;letter-spacing:.2px;
  cursor:pointer;margin-top:6px;
  box-shadow:0 4px 12px rgba(245,158,11,.28);
  transition:transform .12s,box-shadow .12s;
}
.loginbox button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(245,158,11,.36)}
.loginbox button:active{transform:translateY(0)}
.login-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}

/* ---------- App Shell ---------- */
#app{display:none;min-height:100vh}
.topbar-wrap{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
header{
  max-width:1440px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;
}
header svg{height:36px;width:auto;flex-shrink:0}
.title-group{display:flex;flex-direction:column}
header h1{font-size:16px;font-weight:800;color:var(--txt);letter-spacing:-.2px;line-height:1.2}
.subtitle-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;color:var(--mut);font-weight:500;
}
.subtitle-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
#userChip{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
#userChip b{color:var(--txt);font-weight:700}
#userChip button{
  background:none;border:1px solid var(--line);color:var(--mut);
  cursor:pointer;font-size:11px;padding:5px 10px;border-radius:8px;
  transition:all .15s;
}
#userChip button:hover{background:var(--bad-bg);color:var(--bad);border-color:#fecaca}
nav{
  max-width:1440px;margin:0 auto;
  display:flex;gap:4px;padding:0 20px 10px;
  overflow-x:auto;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:1px solid transparent;color:var(--mut);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;
  white-space:nowrap;font-weight:600;transition:all .15s;
}
nav button:hover{background:#f1f5f9;color:var(--txt)}
nav button.on{color:#0f172a;background:var(--acc-soft);border-color:#fde68a;font-weight:800}
main{max-width:1440px;margin:0 auto;padding:20px}

/* ---------- Section head ---------- */
.section-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{font-size:20px;font-weight:800;color:var(--txt);letter-spacing:-.4px}
.section-head .meta{font-size:12px;color:var(--mut)}
.section-head .btn-sm{margin-left:auto}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--shadow-sm);
  border-left:3px solid var(--line);
  transition:box-shadow .15s,transform .15s;
}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kpi.k-ok{border-left-color:var(--ok)}
.kpi.k-bad{border-left-color:var(--bad)}
.kpi.k-gold{border-left-color:var(--acc-bright)}
.kpi.k-slate{border-left-color:#94a3b8}
.kpi .l{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kpi .v{font-size:21px;font-weight:800;color:var(--txt);margin-top:6px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.35}

/* ---------- Cards ---------- */
.cardbox{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);
}
.cardbox h3{font-size:13.5px;color:var(--txt);margin-bottom:12px;font-weight:800;letter-spacing:-.1px}
.cardbox-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cardbox-head h3{margin-bottom:0}
.cardbox-head .hint{font-size:11px;color:var(--mut);margin-left:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.two{grid-template-columns:1fr}}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  color:var(--mut);text-align:left;padding:8px 10px;
  border-bottom:2px solid var(--line);font-weight:700;
  font-size:11px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Badges & buttons ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.2px}
.badge.r{background:var(--bad-bg);color:var(--bad)}
.badge.y{background:#fffbeb;color:#b45309}
.badge.g{background:var(--ok-bg);color:var(--ok)}
.inp{
  background:#f8fafc;color:var(--txt);border:1px solid #cbd5e1;
  border-radius:9px;padding:9px 12px;font-size:13px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(245,158,11,.15);background:#fff}
.btn-pri{
  background:linear-gradient(135deg,#ffd400 0%,#f59e0b 100%);
  color:#0f172a;border:none;border-radius:10px;padding:11px;
  font-weight:800;cursor:pointer;font-size:13px;
  box-shadow:0 2px 8px rgba(245,158,11,.24);transition:all .15s;
}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,158,11,.32)}
.btn-sm{
  background:#fff;border:1px solid var(--line);color:var(--txt);
  border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11px;
  font-weight:600;transition:all .15s;
}
.btn-sm:hover{background:#f1f5f9;border-color:#cbd5e1}
.btn-sm.acc{color:#b45309;border-color:#fde68a;background:#fffbeb}
.btn-sm.acc:hover{background:var(--acc-soft)}

/* ---------- Status toast ---------- */
#status{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:#0f172a;border:none;border-radius:10px;
  padding:10px 18px;font-size:12.5px;color:#f8fafc;
  display:none;z-index:500;box-shadow:0 8px 24px rgba(15,23,42,.24);
  font-weight:600;
}
canvas{max-width:100%}

/* ---------- Mobile ---------- */
@media(max-width:640px){
  header{padding:10px 14px;gap:10px}
  header svg{height:30px}
  header h1{font-size:14px}
  .subtitle-pill{font-size:10px}
  #userChip{font-size:11px;gap:6px}
  #userChip span{display:none}
  nav{padding:0 14px 8px}
  nav button{padding:7px 12px;font-size:12px}
  main{padding:14px}
  .section-head h2{font-size:17px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .kpi{padding:13px;border-radius:12px}
  .kpi .v{font-size:18px}
  .kpi .l{font-size:10px}
  .cardbox{padding:14px;border-radius:12px}
  .loginbox{padding:28px 22px 24px}
}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="loginbox">
    <div class="brand-wrap">
      <svg viewBox="0 0 210 64" xmlns="http://www.w3.org/2000/svg" style="height:64px" aria-label="Ovos Casagrande">
  <path d="M32 6 C 44 6 52 25 52 40 A 20 21 0 1 1 12 40 C 12 25 20 6 32 6 Z" fill="#ffd400"/>
  <ellipse cx="26" cy="30" rx="5" ry="8" fill="#ffffff" opacity=".35"/>
  <text x="62" y="30" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">OVOS</text>
  <text x="62" y="52" fill="#64748b" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">CASAGRANDE</text>
</svg>
    </div>
    <h3>Painel OVOS — Análises</h3>
    <div class="sub">Acesso com a conta CASAGRANDE (e-mail e senha)</div>
    <div class="field">
      <label>E-mail</label>
      <input id="logEmail" type="email" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input id="logPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button onclick="doLogin()">Entrar</button>
    <div class="err" id="logErr"></div>
    <div class="login-foot">Ovos Casagrande · Gestão Executiva</div>
  </div>
</div>

<div id="app">
  <div class="topbar-wrap">
    <header>
      <svg viewBox="0 0 210 64" xmlns="http://www.w3.org/2000/svg" style="height:36px" aria-label="Ovos Casagrande">
  <path d="M32 6 C 44 6 52 25 52 40 A 20 21 0 1 1 12 40 C 12 25 20 6 32 6 Z" fill="#ffd400"/>
  <ellipse cx="26" cy="30" rx="5" ry="8" fill="#ffffff" opacity=".35"/>
  <text x="62" y="30" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">OVOS</text>
  <text x="62" y="52" fill="#64748b" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">CASAGRANDE</text>
</svg>
      <div class="title-group">
        <h1>Painel OVOS — Análises</h1>
        <span class="subtitle-pill"><span class="dot"></span> Gestão Executiva &amp; Indicadores</span>
      </div>
      <div id="userChip"></div>
    </header>
    <nav id="tabs"></nav>
  </div>
  <main id="conteudo"></main>
</div>

<div id="status"></div>
<script src="core.js"></script>
<script src="abas1.js"></script>
<script src="abas2.js"></script>
<script src="vend.js"></script>
<script src="vendp.js"></script>
</body>
</html>
